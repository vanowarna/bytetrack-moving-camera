[project]
name = "bytetrack-moving-camera"
version = "0.1.0"
description = "Quantifying the moving-camera penalty of ByteTrack on MOT17 (reproduction and analysis)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy>=1.26,<2",
    "opencv-python>=4.9,<4.11",
    "scipy>=1.11",
    "lapx>=0.5.9",
    "pycocotools>=2.0.7",
    "loguru>=0.7",
    "thop>=0.1.1.post2209072238",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "motmetrics>=1.4",
    "filterpy>=1.4.5",
]

[tool.uv]
package = false

# RTX 50-series (Blackwell, sm_120) needs CUDA 12.8 wheels
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
